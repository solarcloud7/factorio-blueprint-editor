name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checkout: [default, crlf]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Force CRLF checkout
        if: matrix.checkout == 'crlf'
        shell: bash
        run: |
          git config core.autocrlf true
          git rm -rf .
          git reset --hard HEAD
      - name: Run editor tests
        run: node --test packages/editor/test/*.test.mjs
